<title>Bloom</title>

<style>
:root{--bg:#fff3f8;--card:#fff;--ink:#3a1f2d;--muted:#8c6878;--line:#fad6e5;--accent:#e0538c;--fill:#ffb8d4;--accent-ink:#4a1029;--err:#c62f3c;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 10px 28px rgba(224,83,140,.1)}
h1{font:800 42px/1.1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.045em;color:var(--accent);margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px}
input[type=password]{font:inherit;font-size:18px;text-align:center;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px #ffe6f0}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 18px}
button{font:inherit;font-weight:600;width:100%;padding:12px;border:0;border-radius:999px;background:var(--fill);color:var(--accent-ink);font-weight:800;cursor:pointer;transition:transform .1s,background .15s}
button:hover{background:var(--accent);color:#fff}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--err);font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<form id="f">
  <h1>Bloom</h1>
  <p>Private. Enter your PIN.</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="PIN" required>
  <label><input type="checkbox" id="rem" checked> Remember on this device</label>
  <button id="go">Open</button>
  <div id="err" role="alert"></div>
</form>

const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pass){
  const e=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",e.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(P.i)},key,un(P.c));
  const html=new TextDecoder().decode(out);
  document.open();document.write(html);document.close();
}
const get=()=>{try{return localStorage.getItem("bloom-pass")}catch(e){return null}};
const saved=get();
if(saved){open(saved).catch(()=>{try{localStorage.removeItem("bloom-pass")}catch(e){}})}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const pw=document.getElementById("pw").value.replace(/\s+/g,""), btn=document.getElementById("go");
  const rem=document.getElementById("rem").checked;
  btn.textContent="Opening...";btn.disabled=true;
  try{
    if(rem){try{localStorage.setItem("bloom-pass",pw)}catch(e){}}
    await open(pw);
  }catch(e){
    try{localStorage.removeItem("bloom-pass")}catch(e){}
    document.getElementById("err").textContent="That passcode didn't work. Try again.";
    btn.textContent="Open";btn.disabled=false;
  }
});
</script>
