<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">

<title>Bloom</title>

<style>
:root{--bg:#faf3f4;--card:#fff;--ink:#2b1b20;--muted:#7a6067;--line:#ecd8dd;--accent:#b04a6a;--accent-ink:#fff;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1a1215;--card:#241a1e;--ink:#f6eaed;--muted:#c0a6ae;--line:#3e2e34;--accent:#f0a3bb;--accent-ink:#3a0f1d;--err:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding:16px}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font:700 40px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px}
input[type=password]{font:inherit;font-size:18px;text-align:center;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin:12px 0 18px}
button{font:inherit;font-weight:600;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--err);font-size:14px;min-height:20px;margin:10px 0 0}
</style>
</head>
<body>
<form id="f">
  <h1>Bloom</h1>
  <p>Private. Enter your PIN.</p>
  <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="PIN" required>
  <label><input type="checkbox" id="rem" checked> Remember on this device</label>
  <button id="go">Open</button>
  <div id="err" role="alert"></div>
</form>

const un=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pass){
  const e=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",e.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:un(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const out=await crypto.subtle.decrypt({name:"AES-GCM",iv:un(P.i)},key,un(P.c));
  const html=new TextDecoder().decode(out);
  document.open();document.write(html);document.close();
}
const get=()=>{try{return localStorage.getItem("bloom-pass")}catch(e){return null}};
const saved=get();
if(saved){open(saved).catch(()=>{try{localStorage.removeItem("bloom-pass")}catch(e){}})}
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const pw=document.getElementById("pw").value.replace(/\s+/g,""), btn=document.getElementById("go");
  const rem=document.getElementById("rem").checked;
  btn.textContent="Opening...";btn.disabled=true;
  try{
    if(rem){try{localStorage.setItem("bloom-pass",pw)}catch(e){}}
    await open(pw);
  }catch(e){
    try{localStorage.removeItem("bloom-pass")}catch(e){}
    document.getElementById("err").textContent="That passcode didn't work. Try again.";
    btn.textContent="Open";btn.disabled=false;
  }
});
</script>
